<header
  class="sticky top-0 z-40 flex h-[72px] w-full items-center justify-between border-b border-border bg-surface/90 px-6 backdrop-blur-xl sm:px-8"
>
  <!-- Brand -->
  <div class="flex items-center">
    <img
      src="/logo/logo-wordmark.webp"
      alt="Momentum"
      class="h-6 w-auto select-none"
      draggable="false"
    />
  </div>

  <!-- User -->
  <div class="flex items-center gap-4">
    @if (authService.currentUser(); as user) {
      <div class="hidden text-right md:block">
        <p class="text-xs text-text-tertiary">
          Olá,
        </p>

        <p class="text-sm font-semibold text-text-primary">
          {{ user.email }}
        </p>
      </div>

      <!-- Avatar -->
      <div
        class="flex h-10 w-10 items-center justify-center rounded-full
              bg-gradient-to-r
              from-gradient-start
              via-gradient-middle
              to-gradient-end
              text-sm font-bold text-white">
      {{ user.email.charAt(0).toUpperCase() }}
      </div>
    }

    <!-- Logout -->
    <button
      (click)="logout()"
      class="group flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl border border-border bg-surface-2 text-text-secondary transition-all duration-200 hover:border-primary/40 hover:bg-primary/10 hover:text-primary"
      title="Sair"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="transition-transform duration-200 group-hover:translate-x-0.5"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>
