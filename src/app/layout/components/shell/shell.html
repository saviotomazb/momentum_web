<div class="flex h-dvh w-full flex-col overflow-hidden bg-app-bg text-ink">

  <app-navbar
    [viewport]="viewport()"
    (toggleSidebar)="toggleSidebar()">
  </app-navbar>

  <!-- Overlay (Mobile/Tablet) -->
  @if (viewport() !== 'desktop' && sidebarOpen()) {
    <div
      class="fixed inset-0 top-16 z-40 bg-black/60 backdrop-blur-sm"
      (click)="closeSidebar()">
    </div>
  }

  <div class="flex flex-1 overflow-hidden">

    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [viewport]="viewport()"
      [opened]="sidebarOpen()"
      (navigate)="closeSidebar()">
    </app-sidebar>

    <main
      class="flex-1 overflow-y-auto bg-app-bg p-4 sm:p-6 lg:p-7">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
