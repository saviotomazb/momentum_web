<div
  class="fixed top-6 right-6 z-[9999] flex w-[calc(100vw-2rem)] max-w-sm flex-col gap-3 sm:w-96"
>
  @for (toast of notificationService.toasts(); track toast.id) {
    <div
      class="flex items-start justify-between gap-4 rounded-xl border bg-surface px-5 py-4 text-white shadow-[0_8px_40px_rgba(0,0,0,0.4)]"
      [class.border-emerald-400/20]="toast.type === 'success'"
      [class.bg-emerald-400/10]="toast.type === 'success'"
      [class.border-error/30]="toast.type === 'error'"
      [class.bg-error/10]="toast.type === 'error'"
      [class.border-amber-400/20]="toast.type === 'warning'"
      [class.bg-amber-400/10]="toast.type === 'warning'"
      [class.border-primary/30]="toast.type === 'info'"
      [class.bg-primary/10]="toast.type === 'info'"
      role="alert"
    >
      <span class="flex-1 text-sm font-semibold leading-6 text-white">
        {{ toast.message }}
      </span>

      <button
        type="button"
        class="text-xl leading-none text-text-tertiary transition hover:text-white"
        aria-label="Fechar notificação"
        (click)="remove(toast.id)"
      >
        ×
      </button>
    </div>
  }
</div>
